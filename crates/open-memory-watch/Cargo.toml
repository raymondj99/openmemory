[package]
name = "open-memory-watch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "open-memory: filesystem watcher with incremental re-indexing"
repository.workspace = true

[lints]
workspace = true

[features]
# `sqlite` and `fts5` are forwarded to open-memory-index because the
# watcher writes to MetadataStore + the FTS5 index unconditionally.
# Off by default at the CLI level (the CLI crate enables them); on by
# default here so cargo test against the bare crate works.
default = ["fts5"]
sqlite = ["open-memory-index/sqlite", "open-memory-graph/sqlite"]
fts5 = ["sqlite", "open-memory-index/fts5", "open-memory-graph/fts5"]

[dependencies]
open-memory-core = { workspace = true }
open-memory-index = { workspace = true, default-features = false }
open-memory-graph = { workspace = true, default-features = false }

# File watching + walking
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
ignore = { workspace = true }
walkdir = { workspace = true }

# Hashing + IDs
blake3 = { workspace = true }

# Diagnostics
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
open-memory-core = { workspace = true, features = ["testing"] }
open-memory-graph = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
