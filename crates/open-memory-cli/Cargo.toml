[package]
name = "open-memory-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "open-memory: command-line interface"
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "open-memory"
path = "src/main.rs"

[features]
default = ["fts5", "embeddings", "completions", "watch"]
sqlite = ["open-memory-mcp/sqlite", "open-memory-graph/sqlite", "open-memory-index/sqlite"]
fts5 = [
    "sqlite",
    "open-memory-mcp/fts5",
    "open-memory-graph/fts5",
    "open-memory-index/fts5",
]
hnsw = ["open-memory-mcp/hnsw", "open-memory-graph/hnsw", "open-memory-index/hnsw"]
embeddings = ["open-memory-graph/embeddings", "open-memory-mcp/embeddings"]
mcp-http = ["open-memory-mcp/mcp-http"]
completions = ["dep:clap_complete"]
watch = ["dep:open-memory-watch"]

[dependencies]
open-memory-core = { workspace = true }
open-memory-index = { workspace = true, default-features = false }
open-memory-graph = { workspace = true, default-features = false }
open-memory-mcp = { workspace = true, default-features = false }
open-memory-watch = { workspace = true, default-features = false, optional = true }

clap = { workspace = true }
clap_complete = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
json5 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "io-std"] }

[dev-dependencies]
tempfile = { workspace = true }
