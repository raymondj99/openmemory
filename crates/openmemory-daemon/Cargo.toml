[package]
name = "openmemory-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "openmemory: local daemon and admin API"
repository.workspace = true

[lints]
workspace = true

[features]
default = []
embeddings = ["dep:openmemory-embed"]

[dependencies]
openmemory-admin = { workspace = true }
openmemory-core = { workspace = true }
openmemory-embed = { workspace = true, optional = true }
openmemory-engine = { workspace = true }
openmemory-graph = { workspace = true }
openmemory-index = { workspace = true }

axum = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
