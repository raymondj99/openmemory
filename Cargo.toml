[workspace]
resolver = "2"
members = [
    "crates/openmemory-core",
    "crates/openmemory-index",
    "crates/openmemory-embed",
    "crates/openmemory-graph",
    "crates/openmemory-mcp",
    "crates/openmemory-cli",
    "crates/openmemory-watch",
    "crates/openmemory-bench",
    "crates/openmemory-eval",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Persistent agent memory + hybrid text search, behind an MCP server"
repository = "https://github.com/raymondj99/openmemory"
homepage = "https://github.com/raymondj99/openmemory"

[workspace.dependencies]
# Internal crates
openmemory-core = { path = "crates/openmemory-core", version = "0.3.3" }
openmemory-index = { path = "crates/openmemory-index", version = "0.3.3", default-features = false }
openmemory-embed = { path = "crates/openmemory-embed", version = "0.3.3", default-features = false }
openmemory-graph = { path = "crates/openmemory-graph", version = "0.3.3", default-features = false }
openmemory-mcp = { path = "crates/openmemory-mcp", version = "0.3.3", default-features = false }
openmemory-watch = { path = "crates/openmemory-watch", version = "0.3.3", default-features = false }
openmemory-eval = { path = "crates/openmemory-eval", version = "0.3.3", default-features = false }

# Foundation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }

# Async / IO
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Storage / search
rusqlite = { version = "0.32" }
usearch = "2"
lru = "0.17"

# Embeddings
ort = { version = "2.0.0-rc.9", default-features = false, features = ["load-dynamic", "ndarray"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ndarray = "0.16"

# Hashing / IDs
blake3 = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }

# CLI
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "env"] }
clap_complete = "4"

# MCP. No rmcp dependency: every published version of rmcp (0.x and 1.x)
# requires rustc 1.88+ via if-let chains, which conflicts with our 1.85
# MSRV. openmemory-mcp ships its own minimal JSON-RPC 2.0 server instead.
schemars = { version = "0.8", default-features = false, features = ["derive"] }

# HTTP transport (optional MCP feature)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Network (model downloads, retry helper)
ureq = { version = "2", features = ["json"] }

# Tarball extraction (ONNX Runtime install via `openmemory model download`)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }

# Filesystem helpers
tempfile = "3"
fs4 = "0.12"
json5 = "0.4"

# File watcher (Phase 9 — openmemory-watch crate). MSRV 1.85 for both
# notify-debouncer-full 0.7 (the latest stable; 0.8 is RC) and notify 8.
notify = "8"
notify-debouncer-full = "0.7"
ignore = "0.4"
walkdir = "2"

# String similarity
strsim = "0.11"

# Random (retry jitter)
rand = "0.8"

# Test utilities
proptest = "1"
paste = "1"

# Benchmarks (codspeed-criterion-compat is a transparent drop-in for criterion
# that instruments runs when executed via `cargo codspeed`; behaves as vanilla
# criterion otherwise)
criterion = { version = "4", default-features = false, package = "codspeed-criterion-compat" }

[workspace.lints.rust]
unsafe_code = "warn"
unknown_lints = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
similar_names = "allow"
unnecessary_wraps = "allow"
match_same_arms = "allow"
items_after_statements = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
doc_markdown = "allow"
unreadable_literal = "allow"
return_self_not_must_use = "allow"
if_not_else = "allow"
uninlined_format_args = "allow"
manual_let_else = "allow"
redundant_closure_for_method_calls = "allow"
case_sensitive_file_extension_comparisons = "allow"
needless_raw_string_hashes = "allow"
option_if_let_else = "allow"
str_split_at_newline = "allow"
ref_option = "allow"
disallowed_methods = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.profiling]
inherits = "release"
strip = false
debug = "full"
lto = false
